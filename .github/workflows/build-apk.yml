name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Version string: $JAVA_VER_STRING"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Extracted Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be at least 17, but detected '$JAVA_MAJOR' from '$JAVA_VER_STRING'"
            exit 1
          fi
          echo "Java 17+ (Java $JAVA_MAJOR) environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Check ==="
          KEYSTORE="./debug.keystore"
          if [ -f "$KEYSTORE" ]; then
            echo "Existing debug keystore detected at $KEYSTORE."
          else
            echo "Generating temporary debug keystore at $KEYSTORE..."
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE" ] || [ ! -s "$KEYSTORE" ]; then
            echo "::error::Debug keystore $KEYSTORE does not exist or has zero bytes!"
            exit 1
          fi
          echo "Verified debug keystore at $KEYSTORE (size: $(stat -c%s "$KEYSTORE") bytes)."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== APK Verification ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
            echo "Debug APK found at $APK_PATH"
            ls -lh "$APK_PATH"
            SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
            echo "APK Size: $SIZE"
          else
            echo "::error::Expected APK not found or zero bytes at $APK_PATH"
            echo "Searching app/build/outputs/apk/ for available APKs..."
            find app/build/outputs/apk -type f -name "*.apk" -ls || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Prepare Release Asset ==="
          REPO_FULL="${{ github.repository }}"
          REPO_NAME="${REPO_FULL##*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${RUN_NUM}.apk"

          TEMP_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_DIR"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SRC_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset not found or empty at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH ($(stat -c%s "$ASSET_PATH") bytes)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publish to GitHub Releases ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared asset missing at $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"

          NOTES="### Debug APK Build #${{ github.run_number }}

          - **Commit:** \`${COMMIT_SHA}\`
          - **Run Number:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **File:** \`${ASSET_NAME}\`

          Directly download and install this debug build on your Android device."

          echo "Creating GitHub Release $TAG_NAME targeting $COMMIT_SHA..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download Reporting ==="
          REPO="${{ github.repository }}"
          RUN_NUM="${{ github.run_number }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "Release created successfully."
            RELEASE_URL=$(gh release view "$TAG_NAME" --repo "$REPO" --json url -q .url 2>/dev/null || echo "https://github.com/${REPO}/releases/tag/${TAG_NAME}")
            DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${ASSET_NAME}"

            echo "Release URL: $RELEASE_URL"
            echo "Download URL: $DOWNLOAD_URL"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Android Debug APK Available

          The debug APK has been successfully built and published to GitHub Releases.

          - **Repository:** \`$REPO\`
          - **Run Number:** #$RUN_NUM
          - **Release Tag:** \`$TAG_NAME\`
          - **Release Title:** Debug APK Build #$RUN_NUM
          - **Direct Download:** [Download $ASSET_NAME]($DOWNLOAD_URL)
          - **Release Page:** [View Release]($RELEASE_URL)

          > 💡 **Artifact Fallback:** The APK is also preserved as a GitHub Actions workflow artifact (\`app-debug-apk\`) on this run's summary page.
          EOF
          else
            echo "::warning::GitHub Releases publication did not succeed (outcome: ${{ steps.release.outcome }})."
            echo "The APK remains accessible via GitHub Actions Artifacts under 'app-debug-apk'."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Android Debug APK Build Completed

          The debug APK was built successfully and preserved as an Actions artifact.

          > ⚠️ **GitHub Release Notice:** Publishing to GitHub Releases could not complete (step outcome: \`${{ steps.release.outcome }}\`).

          ### How to Download the APK:
          1. Go to this workflow run's **Summary** page.
          2. Scroll down to the **Artifacts** section.
          3. Download the **\`app-debug-apk\`** artifact containing \`app-debug.apk\`.
          EOF
          fi
