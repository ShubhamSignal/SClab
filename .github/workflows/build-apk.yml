name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VER=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VER"
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Java major version could not be parsed as an integer: $MAJOR_VER"
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java major version $MAJOR_VER is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VER is active."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi
          echo "Debug APK successfully verified at $EXPECTED_APK."
          ls -la "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d /tmp/apk-release-asset-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F/ '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_FULL_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_FULL_PATH"
          if [ ! -s "$ASSET_FULL_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $ASSET_FULL_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_FULL_PATH"
          echo "asset_path=$ASSET_FULL_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI installation..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset validation failed before release creation: $ASSET_PATH"
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### SClab Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}

          > **Testing Notice:**
          > - This APK is intended for testing and development purposes.
          > - This is not a Play Store production release.
          > - The APK is signed only with a temporary debug keystore.

          Download the APK directly from the **Assets** section below.
          EOF
          )

          echo "Creating GitHub Release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### :rocket: Debug APK Release Ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published to GitHub Releases!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download:** The APK file (\`$ASSET_NAME\`) can be downloaded directly from the release **Assets** section on your phone or computer." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved in this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully."
            echo "The APK build and artifact upload succeeded."
            echo "The debug APK is safely preserved as a GitHub Actions artifact named 'app-debug-apk'."

            echo "### :warning: Debug APK Built (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and verified." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "However, automated GitHub Release creation encountered an issue. Your build result is **not lost**:" >> "$GITHUB_STEP_SUMMARY"
            echo "- The debug APK is safely preserved as the Actions artifact named **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
            echo "- You can download it directly from the **Artifacts** section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
